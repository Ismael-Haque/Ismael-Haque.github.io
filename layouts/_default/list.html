{{ define "main" }}
<div class="page-wrapper">
    <aside class="sidebar">
        <a href="{{ .Site.BaseURL }}" class="profile-link">
            <img src="{{ "images/profile.jpg" | relURL }}" alt="Ismael Haque" class="profile-image">
        </a>

        <h2 class="sidebar-name">Ismael Haque</h2>

        <nav class="sidebar-nav" aria-label="Main navigation">
            <a href="{{ .Site.BaseURL }}">Home</a>
            <a href="{{ "projects/" | relURL }}">Projects</a>
            <a href="{{ "publications/" | relURL }}">Publications</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="hero">
            <h1>{{ .Title }}</h1>
        </header>

        <section class="cv-section">
            {{ .Content }}
        </section>

        {{ range .Pages }}
        <article class="cv-section">
            <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
            {{ .Summary }}
        </article>
        {{ end }}
    </main>
</div>
{{ end }}
